name: ANTDEA08

on:
  schedule:
    # Jalan setiap 5 menit: 02, 07, 12, 17, dan seterusnya
    - cron: "2/5 * * * *"

  # Bisa dijalankan manual dari tab Actions
  workflow_dispatch:

concurrency:
  group: doge-trading-bot
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install --no-cache-dir -r requirements.txt

      - name: Run bot
        env:
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_SECRET: ${{ secrets.MEXC_SECRET }}
        run: |
          python main.py

      - name: Save entry state
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet -- entry.json; then
            echo "Tidak ada perubahan entry.json"
          else
            git add entry.json
            git commit -m "Update entry state"
            git push
          fi
